<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Capture Test</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: monospace; }
        #preview { position: fixed; top: 10px; left: 10px; width: 640px; height: 360px; border: 4px solid #00ff00; z-index: 9999; }
        #status { position: fixed; top: 380px; left: 10px; font-size: 20px; z-index: 9999; background: #000; padding: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="js/logic/canInventory.js?v=1080p"></script>
    <script src="js/logic/sprayPaint.js?v=1080p"></script>
    <script src="js/logic/toolCursor.js?v=1080p"></script>
    <script src="js/logic/backpackPalette.js?v=1080p"></script>
    <script src="js/logic/playerCombat.js?v=1080p"></script>
    <script src="js/logic/playerDeath.js?v=1080p"></script>
    <script src="js/logic/playerHurt.js?v=1080p"></script>
    <script src="js/logic/copLogic.js?v=1080p"></script>
    <script src="js/logic/copCombat.js?v=1080p"></script>
    <script src="js/logic/copHurt.js?v=1080p"></script>
    <script src="js/logic/copDeath.js?v=1080p"></script>
    <script src="js/prefabs/Player.js?v=1080p_hd"></script>
    <script src="js/prefabs/Backpack.js?v=1080p_hd"></script>
    <script src="js/prefabs/Exits.js?v=1080p_hd"></script>
    <script src="js/prefabs/Cop.js?v=1080p_hd"></script>
    <script src="js/prefabs/Hud.js?v=1080p_hd"></script>
    <script src="js/prefabs/Blende.js?v=1080p_hd"></script>
    <script src="js/prefabs/CameraHud.js?v=1080p_hd"></script>
    <script src="js/BootScene.js?v=1080p_hd"></script>
    <script src="js/StartScene.js?v=1080p_hd"></script>
    <script src="js/MenuScene.js?v=1080p_hd"></script>
    <script src="js/HomeScene.js?v=1080p_hd"></script>
    <script src="js/halloffame/halloffameNativeLayout.js?v=1080p"></script>
    <script src="js/halloffame/HallOfFameScene.js?v=1080p_hd"></script>
    <script src="js/street/streetNativeLayout.js?v=1080p"></script>
    <script src="js/street/StreetScene.js?v=1080p_hd"></script>
    <script src="js/trainyard/trainyardNativeLayout.js?v=1080p"></script>
    <script src="js/trainyard/TrainyardScene.js?v=1080p_hd"></script>
</head>
<body>
    <div id="game-container"></div>
    <img id="preview" alt="Snapshot Preview">
    <div id="status">Waiting for photo capture...</div>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 1920,
            height: 1080,
            parent: 'game-container',
            backgroundColor: '#000000',
            resolution: 1,
            render: {
                antialias: true,
                roundPixels: false,
                preserveDrawingBuffer: true,
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.NO_CENTER,
            },
            scene: [BootScene, StartScene, MenuScene, HomeScene, HallOfFameScene, StreetScene, TrainyardScene],
        };

        const game = new Phaser.Game(config);

        window.addEventListener('load', () => {
            setTimeout(() => {
                const hof = game.scene.getScene('HallOfFameScene');
                if (hof && hof.cameraHud) {
                    hof.cameraHud.open();
                    setTimeout(() => {
                        hof.cameraHud.takePhoto((dataUrl) => {
                            const img = document.getElementById('preview');
                            const status = document.getElementById('status');
                            img.src = dataUrl;
                            status.innerText = 'PHOTO CAPTURED! Length: ' + dataUrl.length;
                        });
                    }, 500);
                }
            }, 2500);
        });
    </script>
</body>
</html>
